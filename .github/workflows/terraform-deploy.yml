name: Terraform plan and apply (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment; selects the tfvars file, the state file and the apply approvals
        type: string
        required: true
      plan_environment:
        description: GitHub Environment for the plan job (the same as environment, or prod-plan for prod)
        type: string
        required: true
      apply:
        description: Apply the saved plan after the plan job
        type: boolean
        default: true
      destroy:
        description: Create a destroy plan instead of a normal plan
        type: boolean
        default: false

env:
  TF_VERSION: "1.14.9"
  TF_IN_AUTOMATION: "true"
  ARM_USE_OIDC: "true"   # Terraform provider and backend sign in with the GitHub OIDC token
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.plan_environment }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_ENVIRONMENT: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=${{ inputs.environment }}.tfstate"

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock-timeout=5m ${{ inputs.destroy && '-destroy' || '' }} \
            -var-file="environments/${TF_ENVIRONMENT}.tfvars" \
            -out=tfplan -detailed-exitcode
          exitcode=$?
          set -e
          if [ "$exitcode" -eq 1 ]; then exit 1; fi
          echo "has_changes=$([ "$exitcode" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -no-color tfplan > plan.txt

      - name: Publish the plan to the run summary
        run: |
          {
            echo "### Terraform plan: \`${TF_ENVIRONMENT}\`"
            echo
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Flag drift
        if: ${{ !inputs.apply && github.event_name != 'pull_request' && steps.plan.outputs.has_changes == 'true' }}
        run: echo "::warning title=Drift detected in ${TF_ENVIRONMENT}::Azure no longer matches the code. Review the plan in the run summary."

      - name: Comment the plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const env = process.env.TF_ENVIRONMENT;
            const marker = `<!-- terraform-plan-${env} -->`;
            let plan = fs.readFileSync('infra/plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan:.*|No changes\..*)$/m) || ['See the plan below.'])[0];
            if (plan.length > 60000) {
              plan = plan.substring(0, 60000) + '\n... truncated, see the workflow run summary for the full plan';
            }
            const fence = '```';
            const body = [
              marker,
              `### Terraform plan: \`${env}\``,
              `**${summary}**`,
              '',
              '<details><summary>Show plan</summary>',
              '',
              fence,
              plan,
              fence,
              '</details>',
              '',
              `Commit ${context.payload.pull_request.head.sha.substring(0, 7)} · [Workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Upload the saved plan
        if: inputs.apply && steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra/tfplan
          retention-days: 1   # the saved plan contains variable values; keep it briefly

  apply:
    name: Apply
    needs: plan
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # "prod" waits here for a required reviewer
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: >
          terraform init -input=false
          -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}"
          -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}"
          -backend-config="key=${{ inputs.environment }}.tfstate"

      - name: Download the saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: infra

      - name: Terraform apply (the reviewed plan)
        run: terraform apply -input=false -lock-timeout=5m tfplan

      - name: Azure login (OIDC)
        if: ${{ !inputs.destroy }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Smoke test
        if: ${{ !inputs.destroy }}
        run: |
          rg=$(terraform output -raw resource_group_name)
          st=$(terraform output -raw storage_account_name)
          state=$(az storage account show --name "$st" --resource-group "$rg" --query provisioningState -o tsv)
          echo "Storage account $st: $state"
          test "$state" = "Succeeded"
          az resource list --resource-group "$rg" --query "[].{name:name, type:type, environment:tags.environment}" -o table
