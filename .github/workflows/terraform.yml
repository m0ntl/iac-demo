name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time per PR or branch; a newer PR push cancels the older PR run
concurrency:
  group: terraform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TF_VERSION: "1.14.9"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend)
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Checkov security scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: true   # report findings without blocking the demo; set to false to enforce

  pr-plan:
    name: PR plan (dev)
    if: github.event_name == 'pull_request'
    needs: validate
    permissions:
      contents: read
      id-token: write        # request the OIDC token for Azure
      pull-requests: write   # post the plan as a PR comment
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: dev
      plan_environment: dev
      apply: false

  deploy-dev:
    name: Deploy dev
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: dev
      plan_environment: dev

  deploy-prod:
    name: Deploy prod
    needs: deploy-dev
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: prod
      plan_environment: prod-plan   # plan without approval (main only), apply in "prod" with approval
